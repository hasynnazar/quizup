<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Керування питаннями | Панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .lang-select {
            width: auto;
            display: inline-block;
            border-radius: 20px;
            font-size: 0.9rem;
            padding: 4px 30px 4px 15px;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid py-5 px-4">
        <div class="d-flex justify-content-between align-items-center mb-4 max-width-1200 mx-auto" style="max-width: 1200px;">
            <h2 data-i18n="title">⚙️ Панель керування тестами</h2>
            <div class="d-flex gap-2 align-items-center">
                <select id="lang-switcher" class="form-select lang-select" onchange="changeLanguage(this.value)">
                    <option value="uk">🇺🇦 UA</option>
                    <option value="pl">🇵🇱 PL</option>
                    <option value="ru">🌍 RU</option>
                </select>
                <button class="btn btn-outline-primary shadow-sm fw-bold" data-bs-toggle="modal" data-bs-target="#bulkModal" data-i18n="bulkBtn">📦 Масовий імпорт</button>
                <a href="index.html" class="btn btn-primary shadow-sm" data-i18n="goToTest">🚀 Перейти до тестування</a>
            </div>
        </div>
        
        <div class="row g-4 max-width-1200 mx-auto" style="max-width: 1200px;">
            <div class="col-md-5">
                <div class="card p-4 shadow-sm sticky-top" style="top: 20px;">
                    <h4 class="mb-3 text-success" id="form-title" data-i18n="newQuestion">➕ Нове питання</h4>
                    <form id="quizForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold" data-i18n="qText">Текст питання:</label>
                            <textarea id="text" class="form-control" rows="2" required></textarea>
                        </div>
                        <div class="mb-2">
                            <label class="form-label" data-i18n="optA">Варіант A:</label>
                            <input type="text" id="optionA" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label" data-i18n="optB">Варіант B:</label>
                            <input type="text" id="optionB" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label" data-i18n="optC">Варіант C (необов'язково):</label>
                            <input type="text" id="optionC" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" data-i18n="optD">Варіант D (необов'язково):</label>
                            <input type="text" id="optionD" class="form-control">
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-success fw-bold" data-i18n="correctOpt">Правильна відповідь:</label>
                            <select id="correctOption" class="form-select" required>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                            </select>
                        </div>
                        <button type="submit" id="submitBtn" class="btn btn-success w-100 py-2 fw-bold" data-i18n="saveBtn">Зберегти в базу ✨</button>
                        <button type="button" id="cancelEditBtn" class="btn btn-secondary w-100 py-2 fw-bold mt-2 d-none" onclick="cancelEdit()" data-i18n="cancelBtn">Скасувати</button>
                    </form>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card p-4 shadow-sm">
                    <h4 class="mb-3 text-primary d-flex justify-content-between align-items-center">
                        <span data-i18n="allQuestions">📋 Всі питання в базі</span>
                        <span id="question-count" class="badge bg-secondary fs-6">0</span>
                    </h4>
                    <div id="questions-list" class="list-group gap-3" style="max-height: 70vh; overflow-y: auto;">
                        <p class="text-muted text-center py-4" id="list-message" data-i18n="loadingList">Завантаження списку питань...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальне вікно масового імпорту -->
    <div class="modal fade" id="bulkModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" data-i18n="bulkTitle">📦 Масовий імпорт питань</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted" data-i18n="bulkFormatDesc">Вставте текст. Правильну відповідь позначте зірочкою (*) ПЕРЕД літерою.</p>
                    <pre class="bg-light p-3 rounded" style="font-size: 0.85rem; color: #555;">1. Яке місто є столицею України?
a) Львів
*b) Київ
c) Одеса
d) Харків</pre>
                    <textarea id="bulkText" class="form-control font-monospace" rows="10" placeholder="Вставте питання сюди..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="cancelBtn">Скасувати</button>
                    <button type="button" class="btn btn-primary fw-bold" id="processBulkBtn" data-i18n="bulkImportAction">Імпортувати в базу</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            uk: {
                title: "⚙️ Панель керування тестами",
                goToTest: "🚀 Перейти до тестування",
                newQuestion: "➕ Нове питання",
                qText: "Текст питання:",
                optA: "Варіант A:",
                optB: "Варіант B:",
                optC: "Варіант C (необов'язково):",
                optD: "Варіант D (необов'язково):",
                correctOpt: "Правильна відповідь:",
                saveBtn: "Зберегти в базу ✨",
                cancelBtn: "Скасувати",
                allQuestions: "📋 Всі питання в базі",
                loadingList: "Завантаження списку питань...",
                dbEmpty: "База даних порожня. Додайте перше питання!",
                editBtnTooltip: "Редагувати питання",
                deleteBtnTooltip: "Видалити питання",
                correctLabel: "Правильно:",
                errorLoad: "Помилка завантаження даних",
                errServer: "Помилка сервера: ",
                errConn: "Не вдалося зв'язатися з сервером Node.js",
                delConfirm: "Ви впевнені, що хочете видалити це питання?",
                delError: "Не вдалося видалити питання",
                editTitle: "✏️ Редагування питання",
                updateBtn: "Оновити питання ✨",
                bulkBtn: "📦 Масовий імпорт",
                bulkTitle: "📦 Масовий імпорт питань",
                bulkFormatDesc: "Вставте текст. Правильну відповідь позначте зірочкою (*) ПЕРЕД літерою.",
                bulkImportAction: "Імпортувати в базу",
                bulkSuccess: "Успішно імпортовано питань: "
            },
            pl: {
                title: "⚙️ Panel zarządzania testami",
                goToTest: "🚀 Przejdź do testu",
                newQuestion: "➕ Nowe pytanie",
                qText: "Treść pytania:",
                optA: "Opcja A:",
                optB: "Opcja B:",
                optC: "Opcja C (opcjonalnie):",
                optD: "Opcja D (opcjonalnie):",
                correctOpt: "Prawidłowa odpowiedź:",
                saveBtn: "Zapisz w bazie ✨",
                cancelBtn: "Anuluj",
                allQuestions: "📋 Wszystkie pytania",
                loadingList: "Ładowanie listy pytań...",
                dbEmpty: "Baza jest pusta. Dodaj pierwsze pytanie!",
                editBtnTooltip: "Edytuj pytanie",
                deleteBtnTooltip: "Usuń pytanie",
                correctLabel: "Poprawna:",
                errorLoad: "Błąd ładowania danych",
                errServer: "Błąd serwera: ",
                errConn: "Nie udało się połączyć z serwerem",
                delConfirm: "Czy na pewno chcesz usunąć to pytanie?",
                delError: "Nie udało się usunąć",
                editTitle: "✏️ Edycja pytania",
                updateBtn: "Aktualizuj pytanie ✨",
                bulkBtn: "📦 Masowy import",
                bulkTitle: "📦 Masowy import pytań",
                bulkFormatDesc: "Wklej tekst. Oznacz poprawną odpowiedź gwiazdką (*) PRZED literą.",
                bulkImportAction: "Importuj do bazy",
                bulkSuccess: "Pomyślnie zaimportowano pytań: "
            },
            ru: {
                title: "⚙️ Панель управления тестами",
                goToTest: "🚀 Перейти к тестированию",
                newQuestion: "➕ Новый вопрос",
                qText: "Текст вопроса:",
                optA: "Вариант A:",
                optB: "Вариант B:",
                optC: "Вариант C (необязательно):",
                optD: "Вариант D (необязательно):",
                correctOpt: "Правильный ответ:",
                saveBtn: "Сохранить в базу ✨",
                cancelBtn: "Отмена",
                allQuestions: "📋 Все вопросы",
                loadingList: "Загрузка списка вопросов...",
                dbEmpty: "База данных пуста. Добавьте первый вопрос!",
                editBtnTooltip: "Редактировать вопрос",
                deleteBtnTooltip: "Удалить вопрос",
                correctLabel: "Правильно:",
                errorLoad: "Ошибка загрузки данных",
                errServer: "Ошибка сервера: ",
                errConn: "Не удалось связаться с сервером",
                delConfirm: "Вы уверены, что хотите удалить этот вопрос?",
                delError: "Не удалось удалить вопрос",
                editTitle: "✏️ Редактирование вопроса",
                updateBtn: "Обновить вопрос ✨",
                bulkBtn: "📦 Массовый импорт",
                bulkTitle: "📦 Массовый импорт вопросов",
                bulkFormatDesc: "Вставьте текст. Правильный ответ отметьте звездочкой (*) ПЕРЕД буквой.",
                bulkImportAction: "Импортировать в базу",
                bulkSuccess: "Успешно импортировано вопросов: "
            }
        };

        let currentLang = localStorage.getItem('appLang') || 'uk';

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('appLang', lang);
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.innerText = translations[lang][key];
                }
            });
            
            document.documentElement.lang = lang;
            
            if (editingQuestionId) {
                document.getElementById('form-title').innerText = translations[lang].editTitle;
                document.getElementById('submitBtn').innerText = translations[lang].updateBtn;
            }
            
            if (allQuestions.length > 0) {
                renderQuestions(allQuestions);
            } else {
                const msgEl = document.getElementById('list-message');
                if (msgEl) msgEl.innerText = translations[lang].dbEmpty;
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('lang-switcher').value = currentLang;
            changeLanguage(currentLang);
        });

        const API_URL = 'https://quizup-backend-ywxq.onrender.com/api/questions';
        let allQuestions = [];
        let editingQuestionId = null;

        async function fetchQuestionsList() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                allQuestions = data;
                renderQuestions(data);
            } catch (err) {
                console.error(err);
                document.getElementById('questions-list').innerHTML = `<p class="text-danger text-center py-4" id="list-message">${translations[currentLang].errorLoad}</p>`;
            }
        }

        function renderQuestions(data) {
            const listContainer = document.getElementById('questions-list');
            document.getElementById('question-count').innerText = data.length;
            
            if (data.length === 0) {
                listContainer.innerHTML = `<p class="text-muted text-center py-4" id="list-message">${translations[currentLang].dbEmpty}</p>`;
                return;
            }

            listContainer.innerHTML = '';
            data.forEach((q, index) => {
                const txt = q.text;
                const qA = q.optionA || q.optiona;
                const qB = q.optionB || q.optionb;
                const qC = q.optionC || q.optionc;
                const qD = q.optionD || q.optiond;
                const corr = q.correctOption || q.correctoption;

                const item = document.createElement('div');
                item.className = 'list-group-item list-group-item-action p-3 rounded border shadow-sm position-relative bg-white';
                item.innerHTML = `
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="mb-1 text-wrap pe-5 fw-bold" style="max-width: 85%;">${index + 1}. ${txt}</h5>
                        <button onclick="editQuestion(${q.id})" class="btn btn-outline-primary btn-sm position-absolute top-0 end-0 m-3 me-5 py-1 px-2" title="${translations[currentLang].editBtnTooltip}">✏️</button>
                        <button onclick="deleteQuestion(${q.id})" class="btn btn-outline-danger btn-sm position-absolute top-0 end-0 m-3 py-1 px-2" title="${translations[currentLang].deleteBtnTooltip}">🗑️</button>
                    </div>
                    <small class="d-block text-muted"><strong>A:</strong> ${qA} | <strong>B:</strong> ${qB}</small>
                    ${qC ? `<small class="d-block text-muted"><strong>C:</strong> ${qC}</small>` : ''}
                    ${qD ? `<small class="d-block text-muted"><strong>D:</strong> ${qD}</small>` : ''}
                    <span class="badge bg-success mt-2">${translations[currentLang].correctLabel} ${corr}</span>
                `;
                listContainer.appendChild(item);
            });
        }

        document.getElementById('quizForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const questionData = {
                text: document.getElementById('text').value,
                optionA: document.getElementById('optionA').value,
                optionB: document.getElementById('optionB').value,
                optionC: document.getElementById('optionC').value || null,
                optionD: document.getElementById('optionD').value || null,
                correctOption: document.getElementById('correctOption').value
            };

            try {
                const url = editingQuestionId ? `${API_URL}/${editingQuestionId}` : API_URL;
                const method = editingQuestionId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(questionData)
                });
                
                const result = await response.json();

                if (response.ok) {
                    cancelEdit(); 
                    fetchQuestionsList(); 
                } else {
                    alert(translations[currentLang].errServer + (result.error || ''));
                }
            } catch (err) {
                alert(translations[currentLang].errConn);
            }
        });

        async function deleteQuestion(id) {
            if (!confirm(translations[currentLang].delConfirm)) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    if (editingQuestionId === id) cancelEdit();
                    fetchQuestionsList();
                } else {
                    alert(translations[currentLang].delError);
                }
            } catch (err) {
                alert(translations[currentLang].delError);
            }
        }

        function editQuestion(id) {
            const q = allQuestions.find(item => item.id === id);
            if (!q) return;
            
            editingQuestionId = id;
            
            document.getElementById('text').value = q.text || '';
            document.getElementById('optionA').value = q.optionA || q.optiona || '';
            document.getElementById('optionB').value = q.optionB || q.optionb || '';
            document.getElementById('optionC').value = q.optionC || q.optionc || '';
            document.getElementById('optionD').value = q.optionD || q.optiond || '';
            document.getElementById('correctOption').value = (q.correctOption || q.correctoption || 'A').toUpperCase();

            document.getElementById('submitBtn').innerText = translations[currentLang].updateBtn;
            document.getElementById('submitBtn').classList.replace('btn-success', 'btn-primary');
            document.getElementById('cancelEditBtn').classList.remove('d-none');
            
            const title = document.getElementById('form-title');
            title.innerText = translations[currentLang].editTitle;
            title.classList.remove('text-success');
            title.classList.add('text-primary');
        }

        function cancelEdit() {
            editingQuestionId = null;
            document.getElementById('quizForm').reset();
            
            document.getElementById('submitBtn').innerText = translations[currentLang].saveBtn;
            document.getElementById('submitBtn').classList.replace('btn-primary', 'btn-success');
            document.getElementById('cancelEditBtn').classList.add('d-none');
            
            const title = document.getElementById('form-title');
            title.innerText = translations[currentLang].newQuestion;
            title.classList.remove('text-primary');
            title.classList.add('text-success');
        }

        // --- ЛОГІКА МАСОВОГО ІМПОРТУ ---
        document.getElementById('processBulkBtn').addEventListener('click', async () => {
            const text = document.getElementById('bulkText').value;
            const btn = document.getElementById('processBulkBtn');
            btn.disabled = true;
            btn.innerText = "⏳...";

            // Розбиваємо текст по номерам (наприклад, "1.", "2)", "12. ")
            const blocks = text.split(/(?:^\d+[\.\)]\s+)/m).filter(b => b.trim().length > 0);
            let importedCount = 0;

            for (const block of blocks) {
                const lines = block.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                if (lines.length < 3) continue; // Має бути хоча б питання і два варіанти

                let qText = lines[0];
                let options = { A: '', B: '', C: '', D: '' };
                let correctOption = 'A';

                for (let i = 1; i < lines.length; i++) {
                    let line = lines[i];
                    let isCorrect = false;
                    
                    // Якщо починається на *, +, або (v) - це правильна відповідь
                    if (/^[\*\+]/.test(line)) {
                        isCorrect = true;
                        line = line.substring(1).trim();
                    }

                    // Шукаємо літери варіантів: a), a., A)
                    const match = line.match(/^([a-d])[.)]\s*(.+)/i);
                    if (match) {
                        const letter = match[1].toUpperCase();
                        options[letter] = match[2];
                        if (isCorrect) correctOption = letter;
                    }
                }

                // Якщо варіантів немає, ігноруємо блок
                if (!options.A && !options.B) continue;

                const questionData = {
                    text: qText,
                    optionA: options.A,
                    optionB: options.B,
                    optionC: options.C || null,
                    optionD: options.D || null,
                    correctOption: correctOption
                };

                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(questionData)
                    });
                    if (res.ok) importedCount++;
                } catch (e) {
                    console.error("Bulk import error:", e);
                }
            }

            btn.disabled = false;
            btn.innerText = translations[currentLang].bulkImportAction;
            
            if (importedCount > 0) {
                alert(translations[currentLang].bulkSuccess + importedCount);
                document.getElementById('bulkText').value = '';
                
                // Закриваємо модалку
                const modal = bootstrap.Modal.getInstance(document.getElementById('bulkModal'));
                modal.hide();
                
                fetchQuestionsList(); // Оновлюємо список
            } else {
                alert("Не вдалося розпізнати питання. Перевірте формат.");
            }
        });

        fetchQuestionsList();
    </script>
</body>
</html>
