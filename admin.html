<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Керування питаннями | Панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container-fluid py-5 px-4">
        <div class="d-flex justify-content-between align-items-center mb-4 max-width-1200 mx-auto" style="max-width: 1200px;">
            <h2>⚙️ Панель керування тестами</h2>
            <a href="index.html" class="btn btn-primary shadow-sm">🚀 Перейти до тестування</a>
        </div>
        
        <div class="row g-4 max-width-1200 mx-auto" style="max-width: 1200px;">
            <div class="col-md-5">
                <div class="card p-4 shadow-sm sticky-top" style="top: 20px;">
                    <h4 class="mb-3 text-success">➕ Нове питання</h4>
                    <form id="quizForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Текст питання:</label>
                            <textarea id="text" class="form-control" rows="2" required placeholder="Введіть питання..."></textarea>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Варіант A:</label>
                            <input type="text" id="optionA" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Варіант B:</label>
                            <input type="text" id="optionB" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Варіант C (необов'язково):</label>
                            <input type="text" id="optionC" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Варіант D (необов'язково):</label>
                            <input type="text" id="optionD" class="form-control">
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-success fw-bold">Правильна відповідь:</label>
                            <select id="correctOption" class="form-select" required>
                                <option value="A">Варіант A</option>
                                <option value="B">Варіант B</option>
                                <option value="C">Варіант C</option>
                                <option value="D">Варіант D</option>
                            </select>
                        </div>
                        <button type="submit" id="submitBtn" class="btn btn-success w-100 py-2 fw-bold">Зберегти в базу ✨</button>
                        <button type="button" id="cancelEditBtn" class="btn btn-secondary w-100 py-2 fw-bold mt-2 d-none" onclick="cancelEdit()">Скасувати</button>
                    </form>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card p-4 shadow-sm">
                    <h4 class="mb-3 text-primary d-flex justify-content-between align-items-center">
                        📋 Всі питання в базі
                        <span id="question-count" class="badge bg-secondary fs-6">0</span>
                    </h4>
                    <div id="questions-list" class="list-group gap-3" style="max-height: 70vh; overflow-y: auto;">
                        <p class="text-muted text-center py-4">Завантаження списку питань...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/questions';
        let allQuestions = [];
        let editingQuestionId = null;

        // 1. Завантаження та відображення списку питань
        async function fetchQuestionsList() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                allQuestions = data;
                
                const listContainer = document.getElementById('questions-list');
                document.getElementById('question-count').innerText = data.length;
                
                if (data.length === 0) {
                    listContainer.innerHTML = '<p class="text-muted text-center py-4">База даних порожня. Додайте перше питання!</p>';
                    return;
                }

                listContainer.innerHTML = '';
                data.forEach((q, index) => {
                    // Гнучке зчитування полів (для малих або великих літер)
                    const txt = q.text;
                    const qA = q.optionA || q.optiona;
                    const qB = q.optionB || q.optionb;
                    const qC = q.optionC || q.optionc;
                    const qD = q.optionD || q.optiond;
                    const corr = q.correctOption || q.correctoption;

                    const item = document.createElement('div');
                    item.className = 'list-group-item list-group-item-action p-3 rounded border shadow-sm position-relative bg-white';
                    item.innerHTML = `
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="mb-1 text-wrap pe-5 fw-bold" style="max-width: 85%;">${index + 1}. ${txt}</h5>
                            <button onclick="editQuestion(${q.id})" class="btn btn-outline-primary btn-sm position-absolute top-0 end-0 m-3 me-5 py-1 px-2" title="Редагувати питання">✏️</button>
                            <button onclick="deleteQuestion(${q.id})" class="btn btn-outline-danger btn-sm position-absolute top-0 end-0 m-3 py-1 px-2" title="Видалити питання">🗑️</button>
                        </div>
                        <small class="d-block text-muted"><strong>A:</strong> ${qA} | <strong>B:</strong> ${qB}</small>
                        ${qC ? `<small class="d-block text-muted"><strong>C:</strong> ${qC}</small>` : ''}
                        ${qD ? `<small class="d-block text-muted"><strong>D:</strong> ${qD}</small>` : ''}
                        <span class="badge bg-success mt-2">Правильно: ${corr}</span>
                    `;
                    listContainer.appendChild(item);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('questions-list').innerHTML = '<p class="text-danger text-center py-4">Помилка завантаження даних</p>';
            }
        }

        // 2. Обробка надсилання форми (Додавання)
        document.getElementById('quizForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const questionData = {
                text: document.getElementById('text').value,
                optionA: document.getElementById('optionA').value,
                optionB: document.getElementById('optionB').value,
                optionC: document.getElementById('optionC').value || null,
                optionD: document.getElementById('optionD').value || null,
                correctOption: document.getElementById('correctOption').value
            };

            try {
                const url = editingQuestionId ? `${API_URL}/${editingQuestionId}` : API_URL;
                const method = editingQuestionId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(questionData)
                });
                
                const result = await response.json();

                if (response.ok) {
                    cancelEdit(); // Скидаємо форму і стан
                    fetchQuestionsList(); // Оновлюємо список праворуч без перезавантаження
                } else {
                    alert('Помилка сервера: ' + (result.error || 'Невідома помилка'));
                }
            } catch (err) {
                alert('Не вдалося зв\'язатися з сервером Node.js');
            }
        });

        // 3. Видалення питання
        async function deleteQuestion(id) {
            if (!confirm('Ви впевнені, що хочете видалити це питання?')) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    if (editingQuestionId === id) cancelEdit();
                    fetchQuestionsList(); // Оновлюємо список
                } else {
                    alert('Не вдалося видалити питання');
                }
            } catch (err) {
                alert('Помилка при видаленні');
            }
        }

        // 4. Редагування питання
        function editQuestion(id) {
            const q = allQuestions.find(item => item.id === id);
            if (!q) return;
            
            editingQuestionId = id;
            
            document.getElementById('text').value = q.text || '';
            document.getElementById('optionA').value = q.optionA || q.optiona || '';
            document.getElementById('optionB').value = q.optionB || q.optionb || '';
            document.getElementById('optionC').value = q.optionC || q.optionc || '';
            document.getElementById('optionD').value = q.optionD || q.optiond || '';
            document.getElementById('correctOption').value = (q.correctOption || q.correctoption || 'A').toUpperCase();

            document.getElementById('submitBtn').innerText = 'Оновити питання ✨';
            document.getElementById('submitBtn').classList.replace('btn-success', 'btn-primary');
            document.getElementById('cancelEditBtn').classList.remove('d-none');
            
            // Змінюємо заголовок
            const title = document.querySelector('.card h4');
            title.innerText = '✏️ Редагування питання';
            title.classList.remove('text-success');
            title.classList.add('text-primary');
        }

        function cancelEdit() {
            editingQuestionId = null;
            document.getElementById('quizForm').reset();
            
            document.getElementById('submitBtn').innerText = 'Зберегти в базу ✨';
            document.getElementById('submitBtn').classList.replace('btn-primary', 'btn-success');
            document.getElementById('cancelEditBtn').classList.add('d-none');
            
            const title = document.querySelector('.card h4');
            title.innerText = '➕ Нове питання';
            title.classList.remove('text-primary');
            title.classList.add('text-success');
        }

        // Запуск при завантаженні сторінки
        fetchQuestionsList();
    </script>
</body>
</html>
